<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Médias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/display3.css') }}">
    <script src="{{ url_for('static', filename='js/pdfjs/pdf.min.js') }}"></script>
    <style>
        /* ------------------------------------------------------------------
           Ces règles doivent l'emporter sur display.css / display3.css :
           sélecteurs d'id + !important sur les propriétés structurantes.
           La scène média ne dépend plus d'aucun style hérité.
           ------------------------------------------------------------------ */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header,
        .footer-area {
            flex: 0 0 auto;
        }

        #pdf-container {
            flex: 1 1 auto !important;
            position: relative !important;
            min-height: 0 !important;   /* sans ça, l'enfant flex déborde */
            overflow: hidden !important;
        }

        #pdf-wrapper,
        #image-wrapper {
            position: absolute !important;
            inset: 0 !important;
            width: auto !important;
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
            transform: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            z-index: 1;
        }

        /* id + classe : l'emporte sur les règles ci-dessus */
        #pdf-wrapper.hidden,
        #image-wrapper.hidden,
        .hidden {
            display: none !important;
        }

        #pdf-canvas {
            display: block !important;
            max-width: 100% !important;
            max-height: 100% !important;
            transform: none !important;
            opacity: 1 !important;
        }

        #image-viewer {
            display: block !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain;
            transform: none !important;
            -webkit-user-drag: none;
        }

        #loader,
        #pdf-info,
        #pdf-progress,
        #no-pdf,
        #media-error {
            position: absolute;
            z-index: 5;
        }

        .page-dots {
            position: absolute;
            z-index: 6;
        }

        #media-error {
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            font: 500 1.4rem/1.4 system-ui, -apple-system, sans-serif;
            opacity: .65;
            z-index: 4;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-date" id="date"></div>
        <div class="header-clock" id="clock"></div>
    </div>

    <div class="pdf-container" id="pdf-container">

        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Chargement</div>
        </div>

        <!-- Scène PDF — plus de div .pdf-scaler intermédiaire -->
        <div id="pdf-wrapper" class="hidden">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <!-- Scène image -->
        <div id="image-wrapper" class="hidden">
            <img id="image-viewer" src="" alt="" draggable="false">
        </div>

        <!-- Média illisible -->
        <div id="media-error" class="hidden"></div>

        <!-- Aucune sélection -->
        <div id="no-pdf" class="no-pdf hidden">
            <div class="no-pdf-icon"></div>
            <div class="no-pdf-title">Aucun média</div>
            <div class="no-pdf-subtitle">Sélectionnez un document ou une image dans l'administration</div>
        </div>

        <div class="pdf-info" id="pdf-info">
            <span class="pdf-name" id="pdf-name">-</span>
            <span class="pdf-page-indicator" id="pdf-page">—</span>
        </div>

        <div class="pdf-progress" id="pdf-progress" style="width: 0%"></div>
    </div>

    <div class="footer-area">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="footer-banner">
            <div class="annonce-label">Annonce</div>
            <div class="annonce-sep"></div>
            <div class="annonce-scroll" id="annonce-scroll">
                <div class="annonce-track track-1"><span id="annonce-text"></span></div>
                <div class="annonce-track track-2"><span id="annonce-text2"></span></div>
            </div>
        </div>
    </div>

    <div class="page-dots">
        <div class="page-dot"></div>
        <div class="page-dot"></div>
        <div class="page-dot active"></div>
    </div>

    <script src="{{ url_for('static', filename='js/display3.js') }}"></script>
</body>

</html>
